name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run default tests
        run: cargo test --locked

      - name: Run adapter feature tests
        run: cargo test --locked --features jupiter-adapter

      - name: Run devnet tests
        run: cargo test --locked --features devnet

      - name: Run devnet adapter feature tests
        run: cargo test --locked --features "devnet jupiter-adapter"

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify package
        run: cargo package --allow-dirty
